server {
    listen 80;
    server_name _;

    # Serve the Vue frontend
    location / {
        root /usr/share/nginx/html;
        index index.html;
        try_files $uri $uri/ /index.html; # Fixes Vue Router history mode
    }

    # Proxy API requests to the backend
    location /api/ {
        # IMPORTANT: The trailing slash strips "/api" from the URL. 
        # A request to /api/users becomes /users when it hits FastAPI.
        
        proxy_pass http://watchlist-backend:8000/;
        
        proxy_set_header Host $host;
        proxy_set_header X-Real-IP $remote_addr;
        proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
    }
}